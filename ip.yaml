      alarms: 1
      alarm: true
    um2: 3213.56
  - at:
      alarms: 2
      alarm: true
    um2: 4363.52
  - at:
      alarms: 3
      alarm: true
    um2: 5741.68
  - at:
      alarms: 4
      alarm: true
    um2: 6798.4
  corner:
    tool: ecc
    pdk: ics55
