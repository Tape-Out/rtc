name: rtc
version: 0.1.0
spec: '0.1'
kind: ip
lang: bsv
identity:
  slug: rtc-tapeout-bsv
  display_name: Real-time clock
  summary: Real-time clock with an alarm.
  category: peripheral
  subcategories:
  - rtc
  ip_family: rtc
  integration_profile:
  - apb4-slave
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: flat
    aw: 8
    dw: 32
  irq:
  - name: irq
    kind: level
params:
  alarms:
    type: int
    default: 1
    range:
    - 1
    - 4
features:
  alarm:
    type: bool
    default: true
    area:
      points:
        '1': 1435.28
        '2': 2585.24
        '3': 3963.4
        '4': 5020.12
      per: alarms
emit:
- kind: bsv
  package: Rtc
  module: mkRtc
  config_type: RtcCfg
  interface: RtcIfc
  ctrl: regs
- kind: verilog-flat
  bus: apb4
deps:
  hwcore: ^0.1
  amba: ^0.1
area:
  # 基线是「闹钟关掉」那一档，而闹钟关掉时 alarms 一个都不例化——
  # 基线因此不随它走，四个格点分毫不差。alarms 的钱全在 alarm 那条特性曲线里。
  base:
    fixed: 1778.28
  margin: 0.005
  model: points-additive
  error:
    bound: 0.005
    sign: over
    note: parameter curves stored as measured points, features added on top, 
      then lifted by 0.005 so that no untested combination predicts under; the 
      worst came in -0.00 percent under before the lift
  measured:
  - at:
      alarms: 1
      alarm: false
    um2: 1778.28
  - at:
      alarms: 2
      alarm: false
